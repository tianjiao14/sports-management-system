socket.on('lock_status', (res) => {
    if (res.success) {
        if (typeof state !== 'undefined' && state) {
            state.isStarted = true; 
        }
        document.getElementById('prep-overlay').style.display = 'none';
        console.log("🔒 场次锁定成功！");
        
        if (res.frozenScore && state) {
            const fs = res.frozenScore;
            console.log("⚡ 正在接收最新高位权威数据包...", fs);
            
            if (state.teamTie) {
                if (state.sportType === 'badminton_team') {
                    state.p1.score = fs.s1 || 0; 
                    state.p2.score = fs.s2 || 0;
                }
                const btTieScoreEl = document.getElementById('bt-tie-score');
                if (btTieScoreEl) btTieScoreEl.innerText = `${fs.s1 || 0} : ${fs.s2 || 0}`;
            } else {
                state.p1.score = fs.s1;
                state.p2.score = fs.s2;
            }
            
            state.p1.sets = fs.p1Sets || 0;
            state.p2.sets = fs.p2Sets || 0;
            state.isSwapped = fs.isSwapped || false;
            
            if (state.teamTie && fs.subMatches && fs.subMatches.length > 0) {
                state.teamTie.subMatches = fs.subMatches;
                fs.subMatches.forEach((sm, sIdx) => {
                    if (sm.status === 'finished') {
                        state.teamTie.scores[sIdx] = sm.score;
                    }
                });
                
                const activeIdx = fs.subMatches.findIndex(sm => sm.status === 'playing');
                const targetIdx = res.activeSubIndex !== undefined ? res.activeSubIndex : fs.subMatches.findIndex(sm => sm.status === 'playing');

if (targetIdx !== -1 && state.sportType === 'badminton') {
            // 🌟 终极修复：只在客户端丢失索引（比如刷新了网页）时，才允许服务端进行覆写
            if (state.teamTie.currentSubIndex === undefined || state.teamTie.currentSubIndex === -1) {
                state.teamTie.currentSubIndex = targetIdx;
                const scoreParts = (fs.subMatches[targetIdx].score || "0:0").split(':').map(Number);
                if (scoreParts.length === 2) {
                    // 防倒退机制：只在服务端比分大于本地比分时恢复，防止将正在打的比赛清零
                    if (scoreParts[0] > state.p1.score || scoreParts[1] > state.p2.score) {
                        state.p1.score = scoreParts[0];
                        state.p2.score = scoreParts[1];
                    }
                }
            }
        }
    }            
            localStorage.setItem('umpire_current_match', JSON.stringify(state));
            if (typeof updateUI === 'function') updateUI();
        }
    } else {
        alert(res.message);
        showScreen('match-list-screen');
    }
});

socket.on('match_occupied', (data) => {
    if (data.matchId === state.matchId && data.locked) {
        if (!state.isStarted) {
            if (state.teamTie && state.teamTie.currentSubIndex !== -1) {
                if (Number(data.subMatchIndex) === Number(state.teamTie.currentSubIndex)) {
                    document.getElementById('occupied-overlay').style.display = 'flex';
                }
            } else {
                document.getElementById('occupied-overlay').style.display = 'flex';
            }
        }
    } else if (data.matchId === state.matchId && !data.locked) {
        if (state.teamTie && state.teamTie.currentSubIndex !== -1) {
            if (Number(data.subMatchIndex) === Number(state.teamTie.currentSubIndex)) {
                document.getElementById('occupied-overlay').style.display = 'none';
            }
        } else {
            document.getElementById('occupied-overlay').style.display = 'none';
        }
    }
});

function showSetup() {
    if (state.teamTie && state.sportType === 'badminton_team') {
        state.isLive = false;
        state.isStarted = false; 
    } else {
        state.isLive = false;
        state.isStarted = false; 
        state.matchId = null;
        localStorage.removeItem('umpire_current_match');
    }
    
    document.getElementById('occupied-overlay').style.display = 'none'; 
    document.getElementById('umpire-screen').style.display = 'none';
    document.getElementById('match-list-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
}

function swapSides() {
    state.isSwapped = !state.isSwapped;
    const dir = state.isSwapped ? 'row-reverse' : 'row';
    
    const genericScore = document.getElementById('generic-score-container');
    if (genericScore) genericScore.style.setProperty('flex-direction', dir, 'important');
    
    const ttMain = document.querySelector('.tt-main');
    if (ttMain) ttMain.style.setProperty('flex-direction', dir, 'important');
    
    const ttHeader = document.querySelector('.tt-header');
    if (ttHeader) ttHeader.style.setProperty('flex-direction', dir, 'important');

    updateUI(); 
}

function manualToggleServer() { state.server = 3 - state.server; updateUI(); }

function manualSwapPos(visualSide) { 
    let n = state.isSwapped ? (visualSide === 1 ? 2 : 1) : visualSide;
    state['p'+n].pos = 1 - state['p'+n].pos; 
    updateUI(); 
}

function manualSetPos(visualSide, visualZone) { 
    if (!state.isStarted) { 
        let n = state.isSwapped ? (visualSide === 1 ? 2 : 1) : visualSide;
        let logicZone = state.isSwapped ? (1 - visualZone) : visualZone;

        state.server = n; 
        const tZ = (n === 1 ? 0 : 1); 
        if(logicZone !== tZ) {
            state['p'+n].pos = 1 - state['p'+n].pos; 
        }
        updateUI(); 
    } 
}
    
function undo() { 
    if(state.history.length > 0) { 
        const h = state.history.pop(); 
        state.p1=h.p1; state.p2=h.p2; state.server=h.server; 
        updateUI(); 
    } 
}

    let coinRotation = 0;
    let isTossing = false;

    function runToss() {
        if (isTossing) return; 
        isTossing = true;
        
        const resDiv = document.getElementById('toss-result');
        const coin = document.getElementById('coin');
        
        resDiv.innerHTML = `<span style="color:#aaa; font-size:14px;">硬币抛空中...</span>`;
        
        const result = Math.floor(Math.random() * 2); 
        const baseSpins = 5 * 360; 
        coinRotation += baseSpins;
        
        if (result === 0) {
            coinRotation = Math.ceil(coinRotation / 360) * 360;
        } else {
            coinRotation = Math.ceil(coinRotation / 360) * 360 + 180;
        }
        coin.style.transform = `rotateY(${coinRotation}deg)`;
        
        setTimeout(() => {
            const faceName = result === 0 ? "正面" : "反面";
            const faceColor = result === 0 ? "#f1c40f" : "#bdc3c7";
            
            resDiv.innerHTML = `Toss 结果: <span style="color:${faceColor}; font-size:20px; margin-left:8px;">${faceName}</span>`;
            isTossing = false; 
        }, 2000); 
    }

function finishSet() { 
    const winThreshold = Math.ceil(state.format / 2);
    
    if (state.p1.sets >= winThreshold || state.p2.sets >= winThreshold) {
        alert("比赛已达到获胜局数，请点击下方“🏆 提交”确认播报成绩。");
        return;
    }

    const s1 = state.p1.score;
    const s2 = state.p2.score;
    const p1Name = state.p1.players.filter(p => p).map(p => p.trim()).join('/');
    const p2Name = state.p2.players.filter(p => p).map(p => p.trim()).join('/');
    
    const isP1SetWin = s1 > s2;
    const setWinnerName = isP1SetWin ? p1Name : p2Name;
    const setScoreText = isP1SetWin ? `${s1}:${s2}` : `${s2}:${s1}`;
    
    showResultModal("🏸 比赛结束", `${setWinnerName} 胜 ${setScoreText}`, null, false);

    state.setHistory.push(`${s1}:${s2}`); 
    let setWinner = 1;
    if(isP1SetWin) {
        state.p1.sets++; 
        setWinner = 1;
    } else {
        state.p2.sets++; 
        setWinner = 2;
    }

    if (state.p1.sets >= winThreshold || state.p2.sets >= winThreshold) {
        updateUI();
        setTimeout(() => {
            const isP1MatchWin = state.p1.sets > state.p2.sets;
            const finalWinner = isP1MatchWin ? p1Name : p2Name;
            
            const finalDetails = state.setHistory.map(s => {
                const pts = s.split(':');
                return isP1MatchWin ? `${pts[0]}:${pts[1]}` : `${pts[1]}:${pts[0]}`;
            }).join('  ');
            
            const msg = `${finalWinner} 胜 ${finalDetails}\n\n📢 请点击底部“🏆 提交”按钮完成上传！`;
            showResultModal("🏆 比赛结束", msg, null, false);
                
            const submitBtn = document.getElementById('submit-btn');
            if(submitBtn) {
                submitBtn.style.border = "4px solid #ffeb3b";
                submitBtn.style.transform = "scale(1.05)";
                submitBtn.style.transition = "all 0.3s ease";
            }
        }, 100);
    } else {
        state.server = setWinner;
        state.p1.score = 0; state.p2.score = 0; state.currentSet++; state.breakTriggered = false;
        startBreakTimer("☕ 局间休息", `第 ${state.currentSet-1} 局已结束，请稍作休息`, 120);
        state.isSwapped = !state.isSwapped;
        const dir = state.isSwapped ? 'row-reverse' : 'row';
        const genericScore = document.getElementById('generic-score-container');
        if (genericScore) genericScore.style.setProperty('flex-direction', dir, 'important');
        updateUI(); 
    }
}

function cancelPrep() {
    if (state.teamTie && state.sportType === 'badminton') {
        state.sportType = 'badminton_team';
        activeModule = SportModules['badminton_team'];
        
        document.getElementById('module-badminton').classList.remove('active');
        document.getElementById('module-badminton').style.display = 'none';
        document.getElementById('module-badminton_team').style.setProperty('display', 'flex', 'important');
        document.getElementById('generic-score-container').style.setProperty('display', 'none', 'important');
        document.getElementById('generic-info-bar').style.display = 'none'; 
        document.getElementById('prep-overlay').style.display = 'none';

        state.p1.score = 0; state.p2.score = 0;
        state.p1.sets = 0;  state.p2.sets = 0;
        state.currentSet = 1;
        state.setHistory = [];

        localStorage.setItem('umpire_current_match', JSON.stringify({
            matchId: state.matchId, court: state.court, sportType: state.sportType,
            title: document.getElementById('match-title').innerText,
            p1: state.p1, p2: state.p2, server: state.server, isSwapped: state.isSwapped,
            isDoubles: state.isDoubles, currentSet: state.currentSet, setHistory: state.setHistory,
            format: state.format, tieLineups: tieLineups, submittedSides: submittedSides, teamTie: state.teamTie
        }));

        renderTeamTieUI(); 
        updateUI();        
        return;
    }
    
    state.isLive = false;
    state.isStarted = false;
    localStorage.removeItem('umpire_current_match'); 
    document.getElementById('prep-overlay').style.display = 'none';
    document.getElementById('umpire-screen').style.display = 'none';
    document.getElementById('match-list-screen').style.display = 'flex';
}

function handleWalkover() {
    if (!state.matchId) return;

    const p1Name = state.p1.players.filter(p => p).join('/');
    const p2Name = state.p2.players.filter(p => p).join('/');
    
    const selectEl = document.getElementById('walkover-select');
    selectEl.innerHTML = `
        <option value="" disabled selected>-- 请选择弃权类型 --</option>
        <optgroup label="直接弃权 (比分清零)">
            <option value="1_wo">${p1Name} 弃权</option>
            <option value="2_wo">${p2Name} 弃权</option>
        </optgroup>
        <optgroup label="因伤弃权 (保留当前比分)">
            <option value="1_injury">${p1Name} 因伤弃权</option>
            <option value="2_injury">${p2Name} 因伤弃权</option>
        </optgroup>
        <option value="both">❌ 双方弃权 (无胜者)</option>
    `;
    
    document.getElementById('walkover-modal').style.display = 'flex';
}

function confirmWalkover() {
    const selectEl = document.getElementById('walkover-select');
    const val = selectEl.value;
    
    if (!val) {
        showResultModal("⚠️ 提示", "请先选择弃权方和类型", null, false);
        return;
    }

    let finalSets1 = 0, finalSets2 = 0;
    let details = "";
    let confirmMsg = "";
    const winThreshold = Math.ceil(state.format / 2);

    const p1Name = state.p1.players.filter(p => p).map(p => p.trim()).join('/');
    const p2Name = state.p2.players.filter(p => p).map(p => p.trim()).join('/');

    if (val === "both") {
        confirmMsg = "确定判决【双方弃权】吗？";
        details = "双方弃权(Double W/O)";
    } else {
        const [loserNum, type] = val.split('_');
        const isLoserP1 = (loserNum === '1');
        const loserName = isLoserP1 ? p1Name : p2Name;
        const winnerName = isLoserP1 ? p2Name : p1Name;

        if (type === 'injury') {
            let historyStr = state.setHistory.join('  ');
            let currentScore = `${state.p1.score}:${state.p2.score}`;
            details = (historyStr ? historyStr + '  ' : '') + currentScore + " (因伤)";
            
            finalSets1 = isLoserP1 ? state.p1.sets : winThreshold;
            finalSets2 = isLoserP1 ? winThreshold : state.p2.sets;
            confirmMsg = `确定判决【${loserName}】因伤弃权吗？\n当前比分 [${currentScore}] 将被保留。`;
        } else {
            details = "弃权(W/O)";
            finalSets1 = isLoserP1 ? 0 : winThreshold;
            finalSets2 = isLoserP1 ? winThreshold : 0;
            confirmMsg = `确定判决【${loserName}】直接弃权吗？比分将按全负处理。`;
        }
    }

    showResultModal("🏳️ 弃权确认", confirmMsg, () => {
        document.getElementById('walkover-modal').style.display = 'none';
        
        if (state.teamTie && activeModule === SportModules['badminton']) {
            const subIdx = state.teamTie.currentSubIndex;
            
            state.p1.sets = finalSets1;
            state.p2.sets = finalSets2;
            state.teamTie.scores[subIdx] = `${finalSets1}:${finalSets2}`;
            const newTieScore = getTeamTieScore();
            
            socket.emit('update_score', { 
                id: state.matchId, 
                court: state.court, 
                teamScore: newTieScore, 
                subMatchIndex: subIdx,
                subMatchScore: details 
            });

            state.sportType = 'badminton_team';
            activeModule = SportModules['badminton_team'];
            
            const badmintonModule = document.getElementById('module-badminton');
            badmintonModule.classList.remove('active');
            badmintonModule.style.display = 'none';
            document.getElementById('module-badminton_team').style.setProperty('display', 'flex', 'important');
            document.getElementById('generic-score-container').style.setProperty('display', 'none', 'important');
            document.getElementById('prep-overlay').style.display = 'none';

            renderTeamTieUI(); 
            updateUI();        
            
            showResultModal("✅ 判决成功", "当前小场已判决结束，请准备进行团体赛的下一场。", null, false);
        } else {
            socket.emit('finish_match', { 
                id: state.matchId, 
                court: state.court,
                details: details, 
                setScore1: finalSets1,
                setScore2: finalSets2 
            });

            showResultModal("✅ 判决成功", "比分已成功上传至记录台。", () => {
                cancelPrep(); 
            }, false);
        }
    });
}

let breakInterval = null;

function startBreakTimer(title, msg, seconds) {
    const overlay = document.getElementById('break-overlay');
    const titleEl = document.getElementById('break-title');
    const timerEl = document.getElementById('break-timer');
    const msgEl = document.getElementById('break-msg');
    
    titleEl.innerText = title;
    msgEl.innerText = msg;
    let timeLeft = seconds;
    timerEl.innerText = timeLeft;
    overlay.style.display = 'flex';

    if(breakInterval) clearInterval(breakInterval);
    
    breakInterval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = timeLeft;
        if (timeLeft <= 0) closeBreak();
    }, 1000);
}

function closeBreak() {
    if(breakInterval) clearInterval(breakInterval);
    document.getElementById('break-overlay').style.display = 'none';
}

function showResultModal(title, content, onConfirm, showCancel = true) {
    document.getElementById('result-title').innerText = title;
    document.getElementById('result-content').innerText = content;
    document.getElementById('result-overlay').style.display = 'flex';
    document.getElementById('result-cancel').style.display = showCancel ? 'block' : 'none';
    
    const confirmBtn = document.getElementById('result-confirm');
    confirmBtn.onclick = () => {
        closeResultModal();
        if(onConfirm) onConfirm();
    };
}

function closeResultModal() {
    document.getElementById('result-overlay').style.display = 'none';
}

socket.on('manager_revoke_result', (data) => {
    if (state.matchId === data.id) {
        showResultModal("↩️ 撤销通知", "管理员已撤销本场比赛结果，该场次已重新回到待赛列表...", () => {
            showSetup(); 
        }, false);
    }
});

window.addEventListener('load', () => {
    const savedStateStr = localStorage.getItem('umpire_current_match');
    if (savedStateStr) {
        try {
            const savedData = JSON.parse(savedStateStr);
            if (confirm(`检测到你有未完成的执裁 (场地 ${savedData.court})，是否恢复进度？`)) {
                state.matchId = savedData.matchId;
                state.court = savedData.court;
                state.sportType = savedData.sportType;
                state.format = savedData.format;
                state.isDoubles = savedData.isDoubles;
                state.p1 = savedData.p1;
                state.p2 = savedData.p2;
                state.server = savedData.server;
                state.isSwapped = savedData.isSwapped;
                state.currentSet = savedData.currentSet;
                state.setHistory = savedData.setHistory;
                state.isLive = true;
                
                if (savedData.tieLineups) tieLineups = savedData.tieLineups;
                if (savedData.submittedSides) submittedSides = savedData.submittedSides;
                if (savedData.teamTie) state.teamTie = savedData.teamTie;
                
                state.isStarted = (state.sportType === 'badminton'); 
                
                if (state.teamTie && typeof getTeamTieScore === 'function') {
                    if (savedData.teamTie.scores) state.teamTie.scores = savedData.teamTie.scores;
                    const currentRealTieScore = getTeamTieScore();
                    const btTieScoreEl = document.getElementById('bt-tie-score');
                    if (btTieScoreEl) btTieScoreEl.innerText = currentRealTieScore.split(':').join(' : ');
                }
                
                document.querySelectorAll('.sport-module').forEach(el => {
                    el.classList.remove('active');
                    el.style.setProperty('display', 'none', 'important');
                });
                
                activeModule = SportModules[state.sportType]; 
                const moduleContainer = document.getElementById(`module-${state.sportType}`);
                if (moduleContainer) {
                    moduleContainer.classList.add('active');
                    moduleContainer.style.setProperty('display', 'flex', 'important');
                }

                document.getElementById('match-title').innerText = savedData.title || "比赛恢复中";
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('match-list-screen').style.display = 'none';
                document.getElementById('umpire-screen').style.display = 'flex';
                
                if (state.sportType === 'badminton_team') {
                    document.getElementById('generic-score-container').style.setProperty('display', 'none', 'important');
                    document.getElementById('generic-info-bar').style.display = 'none';
                    document.getElementById('prep-overlay').style.display = 'none';
                } else {
                    document.getElementById('generic-score-container').style.setProperty('display', 'flex', 'important');
                    document.getElementById('generic-info-bar').style.display = 'flex';
                }

                socket.emit('join_court', state.court);
                
                const loadPayload = { matchId: state.matchId };
                if (state.teamTie && state.teamTie.currentSubIndex !== -1) {
                    loadPayload.subMatchIndex = state.teamTie.currentSubIndex;
                }
                socket.emit('lock_match', loadPayload);

                if (state.isSwapped) {
                    const dir = 'row-reverse';
                    document.getElementById('generic-score-container').style.setProperty('flex-direction', dir, 'important');
                }
                updateUI(); 
            } else {
                localStorage.removeItem('umpire_current_match');
            }
        } catch (e) {
            console.error("恢复记忆体失败", e);
        }
    }
});

function toggleForfeitLineup(cb, mIdx, side) {
    if (cb.checked) {
        document.querySelectorAll(`input[name="match_${mIdx}_side_${side}"]`).forEach(el => {
            if (el !== cb) el.checked = false;
        });
        
        const m1 = document.getElementById(`manual_${mIdx}_side_${side}_1`);
        const m2 = document.getElementById(`manual_${mIdx}_side_${side}_2`);
        if (m1) m1.value = '';
        if (m2) m2.value = '';
    }
}

function clearForfeit(mIdx, side) {
    const forfeitCb = document.querySelector(`input[name="match_${mIdx}_side_${side}"][value="弃权"]`);
    if (forfeitCb) forfeitCb.checked = false;
}

if (typeof socket !== 'undefined') {
    socket.on('lock_status', (res) => {
        if (res.success && res.isTeamMatch && res.subMatches) {
            if (typeof state !== 'undefined') {
                if (!state.teamTie) state.teamTie = { scores: [], order: [] };
                
                state.teamTie.subMatches = res.subMatches;
                state.teamTie.scores = res.subMatches.map(sm => sm.status === 'finished' ? sm.score : null);
                
                if (typeof renderTeamTieUI === 'function') {
                    renderTeamTieUI(); 
                }
                
                if (typeof showFinalTeamSubmitButton === 'function' && typeof getTeamTieScore === 'function') {
                    const wins = getTeamTieScore().split(':').map(Number);
                    const threshold = Math.ceil(res.subMatches.length / 2);
                    if (wins[0] >= threshold || wins[1] >= threshold) {
                        showFinalTeamSubmitButton();
                    }
                }
            }
        }
    });
}
